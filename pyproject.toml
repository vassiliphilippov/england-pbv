[project]
name = "england-pbv"
version = "0.1.0"
description = "Potentially Beautiful Views of England — objective terrain-based discovery of panoramic viewpoints from open elevation and land-cover data"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Vassili Philippov", email = "vassiliphilippov@gmail.com" }]
keywords = [
    "viewshed",
    "gis",
    "terrain",
    "england",
    "scenic",
    "viewpoints",
    "dem",
    "landscape",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=2.0",
    "numba>=0.61",
    "rasterio>=1.4",
    "pyproj>=3.7",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "requests>=2.32",
    "scipy>=1.14",
    "tqdm>=4.66",
    "pillow>=12.3.0",
]

[project.urls]
Homepage = "https://github.com/vassiliphilippov/england-pbv"
Repository = "https://github.com/vassiliphilippov/england-pbv"
Issues = "https://github.com/vassiliphilippov/england-pbv/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/england_pbv"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["rasterio", "rasterio.*", "numba", "numba.*", "scipy", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "I",      # isort
    "TID252", # no relative imports
]

[tool.ruff.lint.isort]
known-first-party = ["england_pbv"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.0",
    "ruff>=0.8",
    "types-requests",
    "types-tqdm",
]
